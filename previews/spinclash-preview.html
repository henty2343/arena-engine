        by: foe.slot, sid: st.sid, x: st.x, y: st.y, sr: st.r, gap: gap,
        fFl: foe.fl.u.slice(),                                            // swatter chain pose (flail)
        fx: foe.pos.x, fy: foe.pos.y, fAng: foe.wAngle, fW: foe.weapon,   // swatter pose — the audit recomputes the touch from exactly these
      };
      if (WEAPONS[foe.weapon].lead || WEAPONS[foe.weapon].headLead) sev.fSp = foe.spin;                   // edge-leading: the swatter's signed spin at the touch (flagged weapons only)
      emit(G, 'swat', sev);
    } else if (reason === 'rim') {
      G.stats.rim++;
      emit(G, 'shotRim', { by: st.o, sid: st.sid, x: st.x, y: st.y, sr: st.r });
    } else if (reason === 'catch') {                     // touchorbit-r53 the PURE-TOUCH catch: the world orbit actually crossed the wielder's body — an event, not an invariant; catchonly-r56: the ONLY returns departure left (blades and projectiles are immune-passed), and the arc-aware arm guarantees it is a real intercept, never the departure tick
      emit(G, 'shotCatch', { by: st.o, sid: st.sid, x: st.x, y: st.y, sr: st.r });
    } else {                                             // 'cross' — shot-vs-shot cancel; snapfix-r57: loop vs projectile the cancel is ONE-SIDED — the projectile dies here alone, the loop flies on; catchghost-r58: a boomerang PAIR reaches the shared both-die path (killShot fires twice, one per arc)
      G.stats.crossed++;
      emit(G, 'shotCross', { sid: st.sid, x: st.x, y: st.y, sr: st.r });
    }
  }

  function shotHitBody(G, fs, st, foe, bd) {
    const owner = fs[st.o];
    const dealt = st.dmg;
    foe.hp = Math.max(0, foe.hp - dealt);
    const vd = Math.hypot(st.vx, st.vy) || 1;            // knock along the shot's flight line — except a NAIL's (pinfix-r45): its velocity is the frozen impact facing (art), so the knock reads the stored inward normal pnx/pny instead
    const kx = st.pinned ? st.pnx : st.vx / vd, ky = st.pinned ? st.pny : st.vy / vd;
    foe.vel.x += kx * CFG.hitKnock;
    foe.vel.y += ky * CFG.hitKnock;
    G.stats.landed++;
    if (!st.returns) grow(G, owner);
    /* affinity-r66 — THE TRIO'S VICTIM-SIDE PAYLOADS: the page's KIND carries its element (AFFINITY's
     * keys are tome-only art kinds), applied on the damaging hit — the ONE trigger. Fire needs no
     * status: its payload was the birth size (trioRadius). Kills apply too — the round ends anyway. */
    const afEl = AFFINITY[st.kind];
    if (afEl) {
      if (foe.dot) foe.dot.ttl = TRIO.poisonTtl;     // ANY page of the book SUSTAINS the curses (the first smoke caught the cycle self-diluting: every 3rd page + swats starved a per-element refresh — so the book's pressure keeps them alive…)
      if (foe.chill) foe.chill.ttl = TRIO.chillTtl;
      if (afEl === 'poison') applyPoison(G, foe);    // …and the element's OWN page DEEPENS its status (the fire payload rides the shared counter the same way: any hit grows the swell)
      else if (afEl === 'frost') applyChill(G, foe);
    }
    // bloom-r73 — TRANSFIGURATION: the comet's hit is the shot-side bloom trigger (the spine side lives in bladeVsBody)
    if (owner.weapon === 'wand' && WEAPONS.wand.trait.fig > 0) tryFig(G, WEAPONS.wand, owner, foe);
    // emberpool-r79 — THE BURNING POOL: every damaging scroll hit leaves fire where the victim stood
    if (owner.weapon === 'scroll') {
      G.pools.push({ x: foe.pos.x, y: foe.pos.y, r: POOL.r, t: POOL.life, acc: 0, in: false, o: owner.slot, dmg: Math.max(0.5, owner.dmg * POOL.rate), sid: st.sid });
      if (G.pools.length > POOL.cap) G.pools.shift();   // the lace guard: oldest fire dies young
      G.stats.pools++;
      emit(G, 'pool', { by: owner.slot, sid: st.sid, x: foe.pos.x, y: foe.pos.y });
    }
    // growth: exactly as blade hits — freeloop-r38: a returning shot's hits never grow (owner ruling 2026-10-31, "each catch and throw makes it faster" — hits damage only), so a returning shot's pass-through hit never grows; the catch cycle is the trigger
    const kill = foe.hp <= 0;
    if (kill) { foe.alive = false; foe.deathSeq = ++G.deathSeq; }
    emit(G, 'hit', {
      by: owner.slot, to: foe.slot, dealt: dealt, kill: kill, shot: true, sid: st.sid,
      x: foe.pos.x, y: foe.pos.y,                        // victim at the contact instant
      sx: st.x, sy: st.y, sr: st.r, gap: bd - (CFG.bodyR + st.r),   // shot at its death instant — the audit recomputes the touch from these
      spin: Math.abs(owner.spin), dmg: owner.dmg,
    });
  }

  /* skewer-r46 — THE JAVELIN'S SKEWER. Victim state f.skew = { phase 'carry'|'pin', t, dur,
   * sx/sy (carry start), dx/dy (rim dest — along the FLIGHT LINE, javelincarry-r52), spinBase (the EXACT spin restore), bleedAcc, nx/ny
   * (inward normal), cutArm, anchor (the impaling shot ref) }; the shot carries st.skewVictim
   * (ref) + st.skewCarry (the swat-exempt grace flag). The pin reuses the NAIL machinery
   * (pinned, speed 0, pnx/pny, snapped just inside the rim — the budget reads speed, the art
   * reads the frozen flight line). Release: killShot's hook — ANY destruction of the anchor
   * frees (the victim's blade cut, an enemy cross, ...), and the roll resets f.skew wholesale
   * (the round-reset LAW). No pin clock: the crawl is the timer. */
  function startSkewer(G, st, foe) {
    const half = CFG.size / 2;
    const sp = Math.hypot(st.vx, st.vy) || 1;
    const ux = st.vx / sp, uy = st.vy / sp;                  // javelincarry-r52: the flight line IS the carry line again — AND the facing the spear keeps the whole way (owner: "the targets should get carried by the javelin in the javelins direction, but right now its the target which carries the javelin to the nearest rim in their direction"; the carrydir-r51 victim-heading drag is retired, and with it the r50/r51 facing turn — "instead of suddenly turning left or right to hit the rim")
    const px = foe.pos.x - half, py = foe.pos.y - half;
    const R = half - CFG.bodyR;                              // the boundary's own clamp radius — the dest is exactly where the wall would stop them
    const b = px * ux + py * uy;
    const t = -b + Math.sqrt(Math.max(0, b * b - (px * px + py * py) + R * R));   // the exit crossing guarantees û·r̂_dest > 0 — the forward ray from the centre along û always reaches the snap radius
    const o0x = st.x - foe.pos.x, o0y = st.y - foe.pos.y;    // the frozen impact offset — the sink's start (the point where it hit)
    foe.skew = {
      phase: 'carry', t: 0, dur: Math.max(0.1, t / SKEWER.carrySpeed),
      sx: foe.pos.x, sy: foe.pos.y, dx: foe.pos.x + ux * t, dy: foe.pos.y + uy * t,
      spinBase: foe.spin, bleedAcc: 0, nx: 0, ny: 0, cutArm: 0, anchor: st,
      ux: ux, uy: uy,                                        // the flight line — the carry line AND the nail drive's forward-only direction; the facing never leaves it (zero turn: the sinkalign rotation is retired at the owner's eye)
      ox0: o0x, oy0: o0y,                                    // sinkalign-r50: the impact offset, frozen — the sink interpolates DOWN from it to zero (the centre)
      driving: 0, driven: 0, sEnd: 0, dsx: 0, dsy: 0,        // the NAIL-DRIVE sub-phase fields (armed at rim arrival)
    };
    foe.spin = (foe.spin < 0 ? -1 : 1) * SKEWER.spin;        // the crawl starts AT THE HIT (owner: "once the spear carries the opponent… spin slower") — sign kept, leadFlip reads it
    foe.bladeStuck = false;                                  // the carry tears out of any latch — no deep-gate fight mid-drag
    st.skewVictim = foe; st.skewCarry = 1;
    st.skewOx = o0x; st.skewOy = o0y;   // skewfix-r47 + sinkalign-r50 (owner eye-ruling: "when a javelin hits an opponents, it instantly snaps to the centre, it looks bad… make its carry the opponent and also pin from the place where it initially hit"): the spear stays BURIED AT ITS IMPACT POINT — carried and pinned at this constant offset from the body, never snapped to the centre or to the rim
    emit(G, 'skewer', { by: st.o, to: foe.slot, sid: st.sid, x: foe.pos.x, y: foe.pos.y, dist: t });
  }

  function skewStep(G, f, sdt) {
    const s = f.skew;
    if (s.phase === 'carry') {
      s.t += sdt;
      const a = Math.min(1, s.t / s.dur);
      f.pos.x = s.sx + (s.dx - s.sx) * a; f.pos.y = s.sy + (s.dy - s.sy) * a;
      const cx = s.dx - s.sx, cy = s.dy - s.sy, cd = Math.hypot(cx, cy) || 1;
      f.vel.x = cx / cd * SKEWER.carrySpeed; f.vel.y = cy / cd * SKEWER.carrySpeed;   // budget honesty: every velocity reader (the substep budget, the chaos clamp) sees the drag
      if (a >= 1) {                                          // rim arrival → THE NAIL DRIVE (naildrive-r49, owner: "here i want the javelin to go through as the last nail… it moves into the rim as a nail and only forward from its position"): the victim locks at the rim; the spear — still buried at its impact point — advances FORWARD-ONLY along its own flight line into the wall
        s.phase = 'pin';
        const st = s.anchor, half = CFG.size / 2;
        const nx = f.pos.x - half, ny = f.pos.y - half, nd = Math.hypot(nx, ny) || 1;
        s.nx = -nx / nd; s.ny = -ny / nd;
        f.pos.x = s.dx; f.pos.y = s.dy;
        f.vel.x = 0; f.vel.y = 0;
        st.skewOx = 0; st.skewOy = 0; st.x = s.dx; st.y = s.dy;    // the ride AND the sink COMPLETE at the dest — same seam law as the r49/r50 ride-completion fixes (a transition landing mid-substep would otherwise strand the anchor a fraction short of the centre: the smoothstep already delivered it to within a subpixel, this settles it exactly)
        s.dsx = st.x; s.dsy = st.y;                          // javelincarry-r52: the drive starts at the body centre along the FLIGHT LINE (s.ux/uy untouched — the spear keeps going the way it was thrown; the r50 facing/line rewrite to the arrival radial is retired)
        const ppx = st.x - half, ppy = st.y - half;
        const Rs = half - st.r - 0.5;                        // the nail's snap radius: the head seats just inside the rim
        const bb = ppx * s.ux + ppy * s.uy;
        s.sEnd = Math.max(0, -bb + Math.sqrt(Math.max(0, bb * bb - (ppx * ppx + ppy * ppy) + Rs * Rs)));   // the forward ray always exits the snap circle (a stuck point already past it seats at once — sEnd 0)
        s.driving = 1; s.driven = 0;
      }
    } else {                                                 // 'pin': the victim is locked to the rim — the position law beats every force (gravity, knock and resolver pushes are all re-locked next substep)
      f.pos.x = s.dx; f.pos.y = s.dy;
      f.vel.x = 0; f.vel.y = 0;
      const st = s.anchor;
      if (s.driving) {                                       // THE NAIL DRIVE: forward-only along the flight line until the head seats just inside the rim — through the body, into the wall
        s.driven += SKEWER.driveSpeed * sdt;
        const k2 = Math.min(s.driven, s.sEnd);
        st.x = s.dsx + s.ux * k2; st.y = s.dsy + s.uy * k2;
        st.skewOx = st.x - f.pos.x; st.skewOy = st.y - f.pos.y;
        if (s.driven >= s.sEnd) {                            // SEATED: the nail's state — at rest, knock normal stored, the cut-free window opens
          s.driving = 0;
          st.pinned = true; st.speed = 0;
          const h2 = CFG.size / 2, rx = st.x - h2, ry = st.y - h2, rd = Math.hypot(rx, ry) || 1;
          st.pnx = -rx / rd; st.pny = -ry / rd;
          st.skewCarry = 0;
          emit(G, 'skewerPin', { to: f.slot, sid: st.sid, x: st.x, y: st.y });
        }
      }
      if (st.skewCarry || st.pinned) {                       // naildrive-r49: the cut window aims at the spear's ACTUAL position from the victim — right for the head-on pin AND the grazing carry where the nail seats downrange along the wall
        const ax = st.x - f.pos.x, ay = st.y - f.pos.y, ad = Math.hypot(ax, ay) || 1;
        if (!s.cutArm && (Math.cos(f.wAngle) * ax + Math.sin(f.wAngle) * ay) / ad <= SKEWER.cutCos) s.cutArm = 1;   // the blade must leave the window once before it can cut — no instant escapes
      }
    }
  }

  function skewBleed(G, f) {
    const s = f.skew;
    if (s.phase === 'carry' && !SKEWER.carryBleed) return;   // the owner's eye-judgment toggle — carry bleed may die alone; PIN bleed is unconditional (the owner's 100%)
    if (++s.bleedAcc < SKEWER.bleedEvery) return;
    s.bleedAcc = 0;
    f.hp = Math.max(0, f.hp - SKEWER.bleedDmg);
    const kill = f.hp <= 0;
    if (kill) { f.alive = false; f.deathSeq = ++G.deathSeq; }
    emit(G, 'bleedTick', { to: f.slot, dealt: SKEWER.bleedDmg, hp: f.hp, kill: kill, x: f.pos.x, y: f.pos.y });
  }

  /* affinity-r66 — THE TRIO STATUSES: two shallow victim fields (f.dot, f.chill), the SLOT LAW in
   * applyPoison/applyChill, and dotStep mirroring skewBleed exactly (per-TICK rhythm, hp clamp,
   * death + deathSeq, honest events — the proven DoT path). chillMul is the tempo multiplier the
   * weapon-swing site reads (chillfix-r71, owner ruling: the slow never touches the body — the bot
   * never drags or falls; the cadence follows the swing because casting is per-rev); it returns
   * EXACTLY 1 with no chill, so every non-tome match stays bit-identical (x * 1 === x). */
  function applyPoison(G, f) {
    const d = f.dot;
    if (d && d.k === 'poison') { d.n = Math.min(d.n + 1, TRIO.steps); d.ttl = TRIO.poisonTtl; }   // same status: DEEPEN + refresh
    else f.dot = { k: 'poison', n: 1, acc: 0, ttl: TRIO.poisonTtl };                             // a different DoT would REPLACE at 1 stack (the slot law) — poison is the only DoT today
    emit(G, 'poison', { to: f.slot, n: f.dot.n });
  }
  function applyChill(G, f) {
    const c = f.chill;
    if (c) { c.n = Math.min(c.n + 1, TRIO.steps); c.ttl = TRIO.chillTtl; }
    else f.chill = { n: 1, ttl: TRIO.chillTtl };
    emit(G, 'chill', { to: f.slot, n: f.chill.n });
  }
  function chillMul(f) {
    const c = f.chill;
    if (!c || !(c.n > 0)) return 1;
    return Math.max(TRIO.chillFloor, 1 - TRIO.chillPer * Math.min(c.n, TRIO.steps));
  }
  // bloomfix-r77 — THE LAZY SWEEP: a bloomed weapon still sweeps (it IS a weapon, held and swung) but at
  // FIG.slow of its tempo, so the viewer has time to read the burger. Weapon-only, exactly the chill
  // doctrine (chillfix-r71): the sweep sags, the BODY never does — movement, jumps, cadence-of-body untouched.
  function bloomMul(f) {
    return f.figT > 0 ? FIG.slow : 1;
  }
  function dotStep(G, f) {
    const d = f.dot;
    if (d) {
      if (--d.ttl <= 0) { f.dot = null; emit(G, 'dotEnd', { to: f.slot, k: d.k }); }
      else if (++d.acc >= TRIO.poisonEvery) {
        d.acc = 0;
        const dmg = TRIO.poisonDmg * d.n;
        f.hp = Math.max(0, f.hp - dmg);
        const kill = f.hp <= 0;
        if (kill) { f.alive = false; f.deathSeq = ++G.deathSeq; }
        emit(G, 'poisonTick', { to: f.slot, dealt: dmg, hp: f.hp, kill: kill, x: f.pos.x, y: f.pos.y });
      }
    }
    const c = f.chill;
    if (c && --c.ttl <= 0) { f.chill = null; emit(G, 'chillEnd', { to: f.slot }); }
  }
  function releaseSkew(G, v, how, sid) {
    const s = v.skew;
    if (!s) return;
    v.skew = null;
    v.spin = s.spinBase;                                     // EXACT restore — grow() mirrored every impaled landing onto spinBase, so growth during the pin survives
    if (s.phase === 'pin' && v.alive) { v.vel.x += s.nx * SKEWER.releaseKnock; v.vel.y += s.ny * SKEWER.releaseKnock; }   // the pop off the wall
    emit(G, 'skewerFree', { to: v.slot, how: how, phase: s.phase, sid: sid !== undefined ? sid : s.anchor.sid });
  }

  function shotStep(G, fs, sdt) {
    // survivors compact in place (order preserved, no per-substep arrays);
    // cross casualties drop in the second compaction
    const shots = G.shots;
    if (!shots.length) return;
    const half = CFG.size / 2;
    let w = 0;                                           // write index: survivors so far
    for (let i = 0; i < shots.length; i++) {
      const st = shots[i];
      if (st.eiv) { st.emb += sdt; const iv = st.eiv / CFG.tickHz; while (st.emb >= iv) { st.emb -= iv; spawnEmber(G, fs, st); } }   // kindling-r82 — the flight SPILLS its kindling: a coal every eiv ticks of flight (substep-exact)
      if (st.returns) {                                  // touchorbit-r53 THE WORLD ORBIT (the owner's prototype + the PURE-TOUCH ruling): the throw is an arena-centred ellipse, solved once at the throw and FROZEN — the loop lives in the WORLD, not on the wielder. It leaves, orbits (piercing the rim on its far arc) and comes back only when the wielder's motion intercepts it: the catch is an EVENT, not an invariant
        const om = st.speed / st.oa;                     // the constant parametric rate (the KEPLERIAN read: fastest at the near end — st.speed IS the periapsis peak — slowest at the far end, ×ob/oa). The birth-snapshot growth sits inside st.speed ⇒ each catch quickens the orbit (CYCLE-ONLY, unchanged)
        st.ot += st.osn * om * sdt;

        const ex = st.oa * Math.cos(st.ot), ey = st.ob * Math.sin(st.ot);
        st.x = half + ex * cs - ey * sn; st.y = half + ex * sn + ey * cs;
        const tvx = -st.oa * Math.sin(st.ot), tvy = st.ob * Math.cos(st.ot);
        st.vx = (tvx * cs - tvy * sn) * st.osn * om; st.vy = (tvx * sn + tvy * cs) * st.osn * om;   // the true parametric velocity — the knock direction, the art facing and every velocity reader see the real motion
        st.arc += om * sdt;
        st.age += sdt;
      } else if (st.turn) {                              // any other curving row — the wand's BENT SPARK since bendspark-r61 (dormant since the pre-orbit boomerang retired): the constant-rate heading rotation, speed magnitude unchanged (the substep budget reads st.speed and never sees the bend)
        /* hexspark-r65 — THE HEX: the birth bend keeps authority (1−h), a SEEK authority h curves the
         * spark toward the hexed foe. h = min(own.shotStep, TURN_STEPS)/TURN_STEPS, LIVE — not frozen at
         * birth: when the hex deepens, ALL sparks in the air turn hostile at once (the snowball the owner
         * asked to SEE). AUTHORITY IS CONSERVED: |(1−h)·turn + h·|turn|·s| ≤ |turn| ≤ the r62 cap, so the
         * never-orbit law (333px radius floor — orbiting is the boomerang's soul) holds BY CONSTRUCTION,
         * and st.turn itself is never rewritten (frozen at birth, the r61 law). spellform-r69: h now has a
         * FLOOR (SEEK_H0 0.3) at the owner's flight-tuning ruling (*"i just want it to hit the opponent
         * more"*) — the h=0 byte-identity with the r62 bend is RETIRED BY THAT RULING (he owns the flight;
         * the wand bends and hunts with the family). NO new rng draws: the seek reads positions, so every
         * rng stream (the wand's included) stays untouched. */
        let tv = st.turn;
        if (st.hex) {
          const own = G.fighters[st.o];
          if (own) {
            const h = SEEK_H0 + (1 - SEEK_H0) * Math.min(own.shotStep, TURN_STEPS) / TURN_STEPS;   // spellform-r69: the seek floor — the grudge is born with the spell and deepens to full authority at the cap (SEEK_H0)
            if (h > 0) {
              const foe = G.fighters[1 - st.o];
              const err = Math.atan2(foe.pos.y - st.y, foe.pos.x - st.x) - Math.atan2(st.vy, st.vx);
              const ss = Math.max(-1, Math.min(1, Math.atan2(Math.sin(err), Math.cos(err)) / SEEK_BAND));   // shortest-arc wrap + proportional inside the band

            }
          }
        }
        const ta = tv * sdt, tc = Math.cos(ta), ts = Math.sin(ta), nvx = st.vx * tc - st.vy * ts;
        st.vy = st.vx * ts + st.vy * tc; st.vx = nvx;
      }
      if (st.skewCarry) { const sv = st.skewVictim, k = sv.skew;
        if (k.phase === 'carry') {                           // the sinkalign-r50 SINK (owner: "it is already moving towards the centre of the bot… we can fix this by making it smooth"): the stuck spear slides from the impact point to the body centre on a SMOOTHSTEP of the carry progress (zero velocity at both ends — it sticks first, then buries). javelincarry-r52: the facing is NEVER touched here — vx/vy stay the throw's flight vector through the carry, the arrival and the drive (no turn to the rim; the r50 slerp/lerp turns are retired at the owner's eye)
          const a0 = Math.min(1, k.t / k.dur), a = a0 * a0 * (3 - 2 * a0);
          st.skewOx = k.ox0 * (1 - a); st.skewOy = k.oy0 * (1 - a);
          st.x = sv.pos.x + st.skewOx; st.y = sv.pos.y + st.skewOy;
        }                                                  // in the drive sub-phase skewStep owns the anchor's position (forward-only, into the rim)
      }
      else if (!st.pinned && !st.returns) { st.x += st.vx * sdt; st.y += st.vy * sdt; }   // pinlaw-r44: a nailed bolt is AT REST — its unit inward vx/vy is art facing and knock direction, not a velocity. touchorbit-r53: a returning shot's position IS the parametric orbit, written above — never double-integrated
      const foe = fs[1 - st.o];
      // rim first: the boundary is monotone for a straight-flying shot, so it can never tunnel
      const dxr = st.x - half, dyr = st.y - half;
      const dr = Math.hypot(dxr, dyr);
      if (!st.returns && !st.skewVictim && dr + st.r > half) {   // skewer-r46: an anchored javelin never dies at the rim — the carry rides the victim, the pin is snapped inside (a MISSED javelin still dies here, normally)              // r38: a returning shot PIERCES the rim (law 1's second row-owned exception after the shuriken's eternal ricochet) — it flies past the wall and comes home back through it
        if (st.ricochet) {                               // ricolaw-r41 (owner ruling 2026-11-01): a star NEVER dies at the rim — mirror-reflect forever at row speed. Only the foe's body, blade or shot ends the flight; the budget ("bounced once, then died") read as a bug at the eye
          const nx = dxr / dr, ny = dyr / dr, vn = st.vx * nx + st.vy * ny;
          st.vx -= 2 * vn * nx; st.vy -= 2 * vn * ny;
          st.x = half + nx * (half - st.r - 0.5); st.y = half + ny * (half - st.r - 0.5);
          emit(G, 'shotBounce', { by: st.o, sid: st.sid });
        } else if (st.pin) {                             // pinlaw-r44 (owner ruling 2026-11-01: "bolts stays pinned on the rim/edge of the arena, like nails, and when the opponents touch them, they get hit"): the rim NAILS the bolt instead of killing it — law 1's third row-owned exception
          const nx = dxr / dr, ny = dyr / dr;
          st.pinned = true;

  /* v0.8.2 render interpolation: every actor draws at a pose BLENDED between
   * the last two tick poses (prev saved at tick start in stepPhysics; alpha =
   * viewA = leftover tick fraction, set in the frame loop). vx/vy/va are the
   * blended body centre and weapon angle; the sim's f.pos/f.wAngle stay the
   * exact tick poses the laws use. Pattern from sumo_war (2).html. */
  function drawBody(f, vx, vy) {
    const col = COLS[f.idx];
    const al = f.alive ? 1 : 0.5;
    ctx.globalAlpha = al;

    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR, 0, TAU); ctx.fill();
    ctx.strokeStyle = TH.botInk; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR, 0, TAU); ctx.stroke();

    const fl = flashV[f.slot];   // flashV is fed by the hit event's `to`, which is a slot

      ctx.globalAlpha = al * Math.min(1, fl) * 0.9;

      ctx.restore();

     * DoT tight against the body (it is eating him), the curse band outside it, the buff slot
     * outermost (RESERVED — healing comes later). Colour = WHICH status (poison green KP1, frost
     * blue KN1 — the shipped affinity tints); thickness + stand-off = DEPTH (stacks/cap); pulse =
     * TEMPO, and debuffs beat HARD and INWARD: the venom ring tightens as the next bite winds up
     * (d.acc is the anticipation) and snaps bright on the tick (poisonPulse), the chill ring drags
     * on a slow heavy beat. At the cap the ring gains the inner bleed — the MAXED flourish (the hex
     * precedent). Renderer-only: the sim never reads this. */
    const pd = f.alive ? f.dot : null;
    if (pd && pd.k === 'poison') {
      const hn = pd.n / TRIO.steps;
      const beat = poisonPulse[f.slot];
      const wind = pd.acc / TRIO.poisonEvery;
      ctx.save();
      ctx.strokeStyle = KP1;
      ctx.globalAlpha = al * Math.min(1, 0.30 + 0.45 * hn + 0.5 * beat);
      ctx.lineWidth = 2 + 5 * hn + 2 * beat;
      ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 4 + 2 * hn - (2 + 2 * hn) * wind - 2.5 * beat, 0, TAU); ctx.stroke();
      if (pd.n >= TRIO.steps) {
        ctx.globalAlpha = al * (0.35 + 0.3 * beat);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 1.5, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
    const ch = f.alive ? f.chill : null;
    if (ch) {
      const hn = ch.n / TRIO.steps;
      const drag = 0.5 + 0.5 * Math.sin(G.phaseT * 0.07);
      ctx.save();
      ctx.strokeStyle = KN1;
      ctx.globalAlpha = al * (0.30 + 0.45 * hn);
      ctx.lineWidth = 2 + 4 * hn;
      ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 9 + 3 * hn - 2 * drag * (0.5 + hn), 0, TAU); ctx.stroke();
      if (ch.n >= TRIO.steps) {
        ctx.globalAlpha = al * 0.4;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 1.5, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
    /* hexspark-r65 → hexfam-r68 — THE HEX MARK: the victim WEARS the caster's growth counter. Every spell hit
     * that lands on him deepens the hex (the attacker's f.shotStep, capped at TURN_STEPS like every growth axis —
     * and since the family ruling ANY shot.hex attacker marks, in their own cast colour), and
     * the mark says so across the arena: a pulsing ring in the ATTACKER's colour — "his magic is on you" —
     * thickening and standing off with the stacks, plus an inner bleed past half. The pulse rides G.phaseT:
     * the curse's heartbeat throbs inside the slow-mo window and freezes with the KO hold, like every other
     * world FX. Renderer-only — the sim never reads this. */
    const hexer = f.alive ? G.fighters[1 - f.slot] : null;
    const hexW = hexer && hexer.weapon ? WEAPONS[hexer.weapon] : null;
    if (hexW && hexW.shot && hexW.shot.hex && hexer.shotStep > 0) {
      const hh = Math.min(hexer.shotStep, TURN_STEPS) / TURN_STEPS;
      const pulse = 0.5 + 0.5 * Math.sin(G.phaseT * 0.15);
      ctx.save();
      ctx.strokeStyle = COLS[hexer.idx];
      ctx.globalAlpha = al * (0.30 + 0.45 * hh);
      ctx.lineWidth = 2 + 4 * hh;
      ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 5 + 3 * hh + 2 * pulse * hh, 0, TAU); ctx.stroke();
      if (hh > 0.5) {
        ctx.globalAlpha = al * (hh - 0.5) * (0.5 + 0.3 * pulse);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(vx, vy, CFG.bodyR + 1.5, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    }
    // HP number — centred: the only thing inside the bot
    ctx.fillStyle = TH.hpText;
    ctx.font = HP_FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.max(0, Math.ceil(f.hp))), vx, vy + CFG.bodyR * 0.04);
    ctx.globalAlpha = 1;
  }

  function drawWeaponOf(g, f, fightPop, vx, vy, va, vfl, vfp) {
    if (!f.weapon || fightPop <= 0 || !f.alive) return;   // the dead keep no weapon on the frozen K.O. frame — the faded disc is the death mark
    /* catchghost-r58 (owner, on r57's empty hand: "the wielding boomerang is invisible, it should
     * be, fix it"): the held art is drawn ALWAYS — r57's flight/hand-rest skip is withdrawn. The
     * catch's teleport-read (r56 eye: the loop vanished at its touch point while the held copy
     * stayed at the grip) is fixed on the OTHER side instead: a render-only ghost rides the caught
     * arc home — consumeEvents latches the catch point + last-drawn flight state, and draw() slides
     * it into the grip over CGHOST_T ticks, so the eye watches the boomerang come to hand. */

      // the joke object rides at the GRIP — centre 0.45 radii out along the swing, inner edge on the hand, so it TOUCHES the body

     * never tucks — its midpoint sits on the rim and its art straddles it, so

  /* kindling-r82 — THE EMBER SPILL's art (renderer-only, zero sim reads, zero rng): each coal is a

        const an2 = sd + i * TAU / 5;
        g.globalAlpha = 0.7 * (1 - q);
        g.beginPath(); g.arc(fx.x + Math.cos(an2) * (8 + 34 * q), fx.y + Math.sin(an2) * (8 + 34 * q), 0.6 + 2.4 * (1 - q), 0, TAU); g.fill();
      }
    }
    g.restore();
  }

  function drawParryFx(g, dtFrames) {
    for (let i = parryFx.length - 1; i >= 0; i--) {
      const fx = parryFx[i];
      const q = fx.age / PARRY_FX_T;
      if (q >= 1) { parryFx.splice(i, 1); continue; }
      const e = 1 - (1 - q) * (1 - q);   // ease-out: quick pop, soft settle
      const sd = fx.x * 0.17 + fx.y * 0.31, sc = fx.s;
      const fade = 1 - q * q;
      g.save();
      g.lineCap = 'round';
      // core flash
      g.globalAlpha = 0.7 * (1 - q) * (1 - q); g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(fx.x, fx.y, sc * (5 + 10 * (1 - q)), 0, TAU); g.fill();
      // each white stroke rides on a faint warm-grey underlay (wide + dim) so it reads on the cream arena
      const stroke = (path, under, over, w) => {
        g.globalAlpha = under * fade; g.strokeStyle = '#4a3c2c'; g.lineWidth = sc * (w + 1.6) * (1 - 0.5 * q); g.stroke(path);
        g.globalAlpha = over * fade; g.strokeStyle = '#ffffff'; g.lineWidth = sc * w * (1 - 0.5 * q); g.stroke(path);
      };
      const ring = new Path2D(); ring.arc(fx.x, fx.y, sc * (7 + 27 * e), 0, TAU);
      stroke(ring, 0.4, 0.95, 2.4);
      const rays = new Path2D();
      for (let k = 0; k < 6; k++) {
        const an = sd + k * TAU / 6, r0 = sc * (9 + 22 * e), r1 = r0 + sc * (k % 2 ? 5 : 10) * (1 - 0.5 * q);
        rays.moveTo(fx.x + Math.cos(an) * r0, fx.y + Math.sin(an) * r0);
        rays.lineTo(fx.x + Math.cos(an) * r1, fx.y + Math.sin(an) * r1);
      }
      stroke(rays, 0.38, 1, 2.1);
      g.restore();
      fx.age += dtFrames * fxRate;   // wall clock, slowed with the world, frozen in the KO hold
    }
  }

  function revealFrame(p) { return clamp01((1 - p) / 0.06); }   // owner-approved tail fade: full through the poster's life, dissolves into the arena over the last ~17 ticks (the wipe-in belongs to the poster itself)

  /* Poster dials: cadence (cy/xs/land/pre/shuffle/stride/t0) + layout — label
   * slots and the weapon fit box. The two label blocks pulled APART and the
   * weapon shrank (owner tune 2026-10-19: "when we get other bots, they might
   * need a bit more text" — fighter block up, dice block down, 270×165 →
   * 245×150). The probe reads these from the file, so slots stay single-source. */
  const VS = { cy: 500, xs: [275, 725], land: [0.39, 0.39], pre: 7, shuffle: [14, 18], stride: [1, 5], t0: 0.03, roundY: 128, nameY: 258, skillY: 306, box: [245, 150], wnameY: 660, wlineY: 720, dotsY: 674 };

  function vsHalf(i, wipe) {
    const ci = G.cast[i];   // i is the POSTER HALF = the slot; the colour belongs to the ACTOR playing it (pair-r31 split, fixed r32)
    const sh = (1 - wipe) * 520 * (i ? 1 : -1);
    ctx.save();
    ctx.beginPath(); ctx.arc(500, 500, 487, 0, TAU); ctx.clip();      // fill the whole arena disc
    ctx.translate(sh, 0);
    const x0 = i === 0 ? -40 : 500, x1 = i === 0 ? 500 : 1040;        // dead-centre vertical split
    ctx.fillStyle = PLATE; ctx.fillRect(x0, 0, x1 - x0, 1000);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, 1000); ctx.clip();
    ctx.globalAlpha *= 0.55; ctx.fillStyle = COLS[ci]; ctx.fillRect(x0, 0, x1 - x0, 1000); ctx.globalAlpha /= 0.55;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 14;
    for (let d = -600; d < 1200; d += 44) { ctx.beginPath(); ctx.moveTo(d, 1000); ctx.lineTo(d + 380, 0); ctx.stroke(); }
    ctx.restore();
    ctx.lineWidth = 4; ctx.strokeStyle = TH.botInk;                   // centre divider
    ctx.beginPath(); ctx.moveTo(500, 0); ctx.lineTo(500, 1000); ctx.stroke();
    ctx.restore();
  }

  /* one poster weapon on half i: the medallion fit, or the old box fit under ?classic */
  function drawPosterWeapon(i, id, x, y, sc, alpha, tint, acc) {
    if (REVEAL_CLASSIC) drawFitWeapon(id, x, y, -0.22, VS.box[0], VS.box[1], sc, alpha, tint, i === 1, acc);
    else drawMedalWeapon(id, x, y, i === 1, sc, alpha, tint, acc);
  }

  function drawReveal() {
    const N = WEAPON_IDS.length, RT = CFG.revealTicks, tk = G.phaseT, p = tk / RT;
    const roll = G.rolls[G.rolls.length - 1];
    const appear = revealFrame(p);
    const wipe = 1 - Math.pow(1 - clamp01(p / 0.09), 3);
    ctx.save(); ctx.globalAlpha = appear;
    vsHalf(0, wipe); vsHalf(1, wipe);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = appear * wipe;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = '900 44px system-ui'; ctx.lineWidth = 8; ctx.strokeStyle = TH.botInk; ctx.fillStyle = PLATE;
    ctx.strokeText('ROUND ' + G.round, 500, VS.roundY); ctx.fillText('ROUND ' + G.round, 500, VS.roundY);
    ctx.restore();

    /* giant VS under the weapons, so their tips cross it */
    ctx.save();
    ctx.globalAlpha = appear * wipe;
    ctx.translate(500, VS.cy + 6); ctx.scale(1 + (1 - wipe) * 0.8, 1 + (1 - wipe) * 0.8);
    ctx.font = '900 94px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = TH.botInk; ctx.strokeText('VS', 0, 0);
    ctx.fillStyle = PLATE; ctx.fillText('VS', 0, 0);
    ctx.restore();

    for (let i = 0; i < 2; i++) {
      /* i is the POSTER HALF, i.e. the SLOT: VS.xs/shuffle/stride/land and the slot-ordered roll
       * (`roll.w[i]`) are all correctly keyed by it. The CAST tables are not — a half must name,
       * colour and describe the ACTOR playing that side, which is `G.cast[i]`. Reading them by `i`
       * was right only while the pairing was [0, 1]; under a swap the poster named the wrong bot
       * (caught by the r32 review; invisible to fingerprints, to chromecheck's default section and
       * to pair-proof's sim-level sweep, which is why pair-proof now records the poster's text). */
      const ci = G.cast[i];
      const cx = VS.xs[i], cy = VS.cy, wy = cy - 10;   // wy = the weapon's centre line (a little above the VS centre)
      const resultId = roll ? roll.w[i] : WEAPON_IDS[0];
      const M = VS.shuffle[i], stride = VS.stride[i];
      const off = (((WEAPON_IDS.indexOf(resultId) - M * stride) % N) + N) % N;
      const tImpact = VS.land[i] * RT, tStart = VS.t0 * RT, tShEnd = tImpact - VS.pre;
      const since = tk - tImpact, landed = since >= 0;
      const q = clamp01((tk - tStart) / (tShEnd - tStart));
      const x = (-0.12 + Math.sqrt(0.0144 + 3.52 * q)) / 1.76;
      const n = Math.min(M, Math.floor(x * M));
      const sid = WEAPON_IDS[(((n * stride + off) % N) + N) % N];
      const shake = landed ? Math.max(0, 1 - since / 14) : 0;
      const shx = Math.sin(since * 3.1) * 9 * shake, shy = Math.cos(since * 2.3) * 6 * shake;   // 0 whenever shake is 0

      ctx.save();
      ctx.globalAlpha = appear * wipe;
      if (shake) ctx.translate(shx, shy);
      if (!REVEAL_CLASSIC && landed) drawMedalBg(cx, wy, i, 1 + 0.07 * Math.exp(-since / 5) * Math.cos(since * 0.9), tk, clamp01(since / 22));   // the effect shows only AFTER the weapon is revealed (landed), blooming open from the moment of impact
      if (!landed) {
        const jit = ((n * 37) % 7 - 3) * 2.4 * (1 - x);
        drawPosterWeapon(i, sid, cx + jit, wy, 1, 0.34 * clamp01((tk - tStart) / 6), TINTS[ci]);
      }
      const sp = (tk - tShEnd) / VS.pre;
      if (sp > 0) {
        const e = clamp01(sp), ease = e * e;
        const sc = landed ? 1 + Math.max(0, 0.1 * Math.exp(-since / 4) * Math.cos(since * 0.9)) : 1.9 - 0.9 * ease;
        drawPosterWeapon(i, resultId, cx, wy, sc, ease, null, COLS[ci]);
      }
      if (landed && since < 20) {                                   // shockwave + speed lines at the weapon
        const f = since / 20;
        ctx.save(); ctx.translate(cx, wy);
        ctx.beginPath(); ctx.rect(-(cx + shx) - OV_MARGIN, -wy - shy - OV_MARGIN, 1000 + 2 * OV_MARGIN, 1000 + 2 * OV_MARGIN); ctx.clip();   // the burst ends at the canvas edge — square plus band, no overhang (owner fix 2026-10-19, band 2026-10-21)
        ctx.globalAlpha = appear * (1 - f) * 0.9;
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 8 * (1 - f) + 1;
        ctx.beginPath(); ctx.arc(0, 0, 70 + f * 190, 0, TAU); ctx.stroke();
        ctx.lineCap = 'round'; ctx.lineWidth = 6;
        for (let k = 0; k < 14; k++) {
          const ag = k * TAU / 14 + 0.2, r0 = 120 + since * 9, r1 = r0 + 36 * (1 - f);
          ctx.beginPath(); ctx.moveTo(Math.cos(ag) * r0, Math.sin(ag) * r0); ctx.lineTo(Math.cos(ag) * r1, Math.sin(ag) * r1); ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();

      /* Labels live inside each half, regrouped into two blocks (owner
       * decision 2026-10-19, option 1 — the stacked names used to read as one
       * compound, "SPEEDY HAMMER"): the TOP block is the FIGHTER — the
       * scorebug/legend's ink-ringed cast disc ("ring = bot" vocabulary) +
       * name + skill prose, all static truth, on screen from frame 1; the
       * BOTTOM block is the DICE — weapon name + trait line, landing only.
       * Same-day owner tune: the blocks pulled apart (fighter up to 258/306,
       * dice down to 660/720, ROUND up to 128) and the weapon fit shrank to
       * 245×150 — "when we get other bots, they might need a bit more text",
       * so each block owns more air for longer prose. The fighter block still
       * sits clear of the weapon ink: at the smaller box the hammer head
       * corner reaches ≈ y 385 at rest, ≈ y 374 at the 1.1 slam pulse.
       * Disc + name centre as ONE unit on the half's axis (the name alone
       * would drift off-centre once the disc hangs on its left). */
      const W = WEAPONS[resultId];
      ctx.save();
      ctx.globalAlpha = appear * wipe;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = TINTS[ci]; ctx.font = '900 48px system-ui';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
      const nm = FIGHTERS[ci].name.toUpperCase();
      const met = ctx.measureText(nm);
      const nw = (met && typeof met.width === 'number' && met.width > 0) ? met.width : nm.length * 35;   // headless ctx stubs have no metrics — the fallback keeps the group centred for the probes
      const gx = cx - (28 + 14 + nw) / 2;                          // disc (Ø28) + gap (14) + name, centred as one unit
      ctx.beginPath(); ctx.arc(gx + 14, VS.nameY, 14, 0, TAU);
      ctx.fillStyle = COLS[ci]; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = TH.botInk; ctx.stroke();
      ctx.fillStyle = TINTS[ci];
      ctx.fillText(nm, gx + 42 + nw / 2, VS.nameY);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.font = '700 32px system-ui';
      /* skill prose (owner wording 2026-10-19), the weapon trait line's exact recipe — INCLUDING
       * its wrap (nocombo-r34): an unwrapped long line runs across the centre divider into the
       * other half (owner screenshot 2026-10-31). Threshold 26, not the weapon line's 20: at 700
       * 32px a char is ~16px, so 26 chars ≈ 416px inside the ~450px half — 'Spins faster each
       * hit' (21) stays one line and anything that would collide wraps to two. */
      let skParts = FIGHTERS[ci].line.split(' · ');
      if (skParts.length === 1 && FIGHTERS[ci].line.length > 26) { const m = FIGHTERS[ci].line.indexOf(' ', Math.floor(FIGHTERS[ci].line.length / 2) - 3); if (m > 0) skParts = [FIGHTERS[ci].line.slice(0, m), FIGHTERS[ci].line.slice(m + 1)]; }
      skParts.forEach((ln, k) => ctx.fillText(ln, cx, VS.skillY + k * 38));
      if (landed) {
        const a = clamp01(since / 5), st = 1 + (1 - a) * 0.5;
        ctx.save(); ctx.translate(cx, VS.wnameY); ctx.scale(st, st);
        /* the weapon name wears the bot name's exact recipe — same size, same
         * face, same tracking, uppercase (owner decision 2026-10-19) */
        ctx.globalAlpha = appear * a; ctx.fillStyle = TINTS[ci]; ctx.font = '900 48px system-ui';
        if ('letterSpacing' in ctx) ctx.letterSpacing = '5px';
        ctx.fillText(W.name.toUpperCase(), 0, 0);
        if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
        ctx.restore();
        ctx.globalAlpha = appear * clamp01((since - 4) / 8); ctx.fillStyle = TINTS[ci]; ctx.font = '700 32px system-ui';
        let parts = W.line.split(' · ');
        if (parts.length === 1 && W.line.length > 20) { const m = W.line.indexOf(' ', Math.floor(W.line.length / 2) - 3); parts = m > 0 ? [W.line.slice(0, m), W.line.slice(m + 1)] : parts; }
        parts.forEach((ln, k) => ctx.fillText(ln, cx, VS.wlineY + k * 38));
      } else {
        ctx.fillStyle = TINTS[ci]; ctx.globalAlpha = appear * 0.55; ctx.font = '800 44px system-ui';
        ctx.fillText('· · ·', cx, VS.dotsY);
      }
      ctx.restore();
    }
  }

  function drawBanner(dtFrames) {
    if (!banner) return;
    banner.t += dtFrames;
    if (banner.t > 100) { banner = null; return; }
    const a = banner.t < 8 ? banner.t / 8 : banner.t > 80 ? Math.max(0, (100 - banner.t) / 20) : 1;
    ctx.save();
    ctx.globalAlpha = a;
    const h = 72;
    ctx.fillStyle = TH.card.text;
    ctx.font = '700 30px system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banner.text, 500, 96 + h / 2 + 1);
    ctx.restore();
  }

  function draw(dtFrames) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(arenaCv, 0, 0);
    ctx.setTransform(U, 0, 0, U, OV_OFF, OV_OFF);   // sim square centred in the band canvas

    const pop = G.phase === 'fight' ? (G.phaseT + 1) / 8 : 1;   // weapon pop-in ramp: +12.5% per fight tick, full at 8; every other phase draws full size

    /* v0.8.2 render interpolation (pattern from sumo_war (2).html): every
     * actor draws between its last two tick poses, blended by viewA (the
     * frame loop's leftover tick fraction). On displays whose refresh is not
     * an integer multiple of the 120 Hz tick this turns the old dead-frame
     * judder (144 Hz: 16.6% of frames repeated, 240 Hz: 50% — .qa/pacing.mjs)
     * into even motion. viewA = 1 whenever the sim is not stepping, so
     * paused / reveal / K.O. / over frames render the exact latest tick pose
     * and stand perfectly still. Angles blend shortest-arc (lerpAng) because
     * wAngle accumulates unwrapped and can straddle the 2π seam. */
    const view = VIEW;
    if (G.phase !== flipPhase) { flipPhase = G.phase; flipAnim[0].snap = true; flipAnim[1].snap = true; }   // phase ENTRY re-snaps the flip (reveal/bell/ko materialise at truth; only mid-fight recoils animate)
    for (let i = 0; i < 2; i++) {
      const f = G.fighters[i];
      view[i].x = f.prev.x + (f.pos.x - f.prev.x) * viewA;
      view[i].y = f.prev.y + (f.pos.y - f.prev.y) * viewA;
      view[i].ang = lerpAng(f.pwAngle, f.wAngle, viewA);
      /* Edge-leading flip transition (owner decision 2026-10-22 — "a fast
       * transition not an instant snap"): the DISPLAYED lateral factor eases
       * old → edge-on → mirrored as cos(π·p) over CFG.flipMs, reading as the
       * blade spinning about its own spine. fpSim stays the BINARY sim truth
       * (the hitbox overlay draws that, never the squash — debug shows truth);
       * the sim's own geometry flipped at the recoil tick, as always. The
       * transition freezes with the frame under a hitstop (draw() gets
       * dtFrames 0) and snaps at round rolls (resetFx). */
      const fpTarget = f.weapon ? leadFlip(f.weapon, f.spin) : 1;
      view[i].fpSim = fpTarget;
      const fa = flipAnim[i];
      if (fa.snap || G.phase !== 'fight') { fa.cur = fpTarget; fa.t = 0; fa.snap = false; }   // every phase entry snaps (the bell's pop-in materialises the blade in its true orientation — a roll is not a parry); resetFx/phase tracker set snap
      else if (fa.t <= 0 && fa.cur !== fpTarget) { fa.from = fa.cur; fa.t = CFG.flipMs; }    // a parry's recoil flipped the sign: store the OLD side and sweep from it
      if (fa.t > 0) {
        fa.t = Math.max(0, fa.t - dtFrames * 1000 / 60);   // the wall-ms clock draw() already freezes under a hitstop (dtFrames 0) and stretches under slow motion
        const p = 1 - fa.t / CFG.flipMs;
        /* cur = from·cos(π·p): old side → edge-on (0) → −from. Landing is
         * −from, NOT the live target — deliberate: if a re-parry flipped the
         * sign mid-sweep (possible once flipMs outlasts the 133ms flutter
         * gate), the sweep still lands cleanly and the at-rest check above
         * immediately starts a SECOND continuous sweep to the new side: two
         * clangs read as two flips, never a mid-air jump. */
        fa.cur = fa.t <= 0 ? -fa.from : fa.from * Math.cos(Math.PI * p);
      }
      view[i].flip = fa.cur;
      if (f.weapon && WEAPONS[f.weapon].chain) {           // flail chain pose: blend tick-start -> now, link by link (unit vectors, renormalised)
        for (let k = 0; k < 18; k += 2) {
          const ud = f.fl.pu[k] + (f.fl.u[k] - f.fl.pu[k]) * viewA, ul = f.fl.pu[k + 1] + (f.fl.u[k + 1] - f.fl.pu[k + 1]) * viewA;
          const n = Math.sqrt(ud * ud + ul * ul) || 1;
          view[i].fl[k] = ud / n; view[i].fl[k + 1] = ul / n;
        }
      }
    }

    /* Kill still (owner decision 2026-10-19, option 1): during the K.O. hold —
     * and the post-match 'over' freeze, which shows the same scene — the
     * fighters draw at the killing blow's CONTACT poses, so the kill tick's
     * substep drift (knock integrated + blade swung through after the mid-tick
     * detection) can never read as a gap in the frozen frame (seed 63230
     * screenshot). Overriding `view` keeps art, weapon and hitbox debug in
     * agreement. The latch drops as soon as the phase moves on. */
    const still = koStill && (G.phase === 'ko' || G.over) ? koStill : null;
    if (koStill && !still) koStill = null;
    if (G.phase === 'reveal') { lastShots.clear(); sparkTrail.clear(); catchFx[0] = null; catchFx[1] = null; }   // per-round hygiene: sids never repeat, but no reason to carry dead flights or settle ghosts
    /* Kill still: overrides the view for the whole K.O. hold (since
     * 2026-10-19). Non-kill hitstops draw their own lagged-blend hold —
     * a true pause of the on-screen frame (owner 2026-10-27). */
    if (still) {
      for (let i = 0; i < 2; i++) {
        const p = still.pose[i];
        if (p) { view[i].x = p.x; view[i].y = p.y; if (p.ang !== undefined) view[i].ang = p.ang; if (p.fp !== undefined) { view[i].flip = p.fp; view[i].fpSim = p.fp; } if (p.fl) for (let k = 0; k < 6; k++) view[i].fl[k] = p.fl[k]; }   // in-place: VIEW is scratch. The still shows the FULL true contact pose — the flip transition never squashes a frozen frame (a damage event inside the window still draws the honest geometry)
      }
    }

    /* Bodies draw first in EVERY phase, then the phase's own layer goes on top — so the loop is
     * hoisted out of the branch instead of being written twice (r32 review: the two branches opened
     * with a byte-identical statement). Draw order is unchanged: bodies, then the poster OR the
     * weapons + shots. `v` is the fighter's own slot entry in the VIEW scratch — view is
     * SLOT-keyed, so it must never be read by f.idx under a swapped pairing. */
    if (G.phase !== 'reveal') drawPools(ctx);   // emberpool-r79 — the fire lives UNDER the bodies (a disc standing in the pool reads on top of it)
    if (G.phase !== 'reveal') drawEmbers(ctx);   // kindling-r82 — the coals under the bodies, over the pools
    for (const f of G.fighters) { const v = view[f.slot]; drawBody(f, v.x, v.y); }
    if (G.phase === 'reveal') {
      drawReveal();
    } else {
      for (const f of G.fighters) { const v = view[f.slot]; drawWeaponOf(ctx, f, pop, v.x, v.y, v.ang, v.fl, v.flip); } // every weapon on top — view.flip is the DISPLAYED edge-leading factor (continuous only during a ~CFG.flipMs transition)

      // shots: the drawn disc IS the hitbox (arrows/bolts trail behind their
      // head circle) — exact radius, weapon material language
      for (const st of G.shots) {
        lastShots.set(st.sid, st);   // flight-state record for the kill still (see lastShots)
        const sx = st.px + (st.x - st.px) * viewA, sy = st.py + (st.y - st.py) * viewA;
        drawHexTrail(st, sx, sy);   // hexspark-r65: the comet tail goes down BEFORE the flash and the body — the spark rides on top of its own path
        drawCastFlash(ctx, st);
        drawShot(ctx, st, sx, sy);   // every shot kind routes through drawShot — the bow's kindless arrow included (halo + drawArrow inside)
      }
      fadeHexTrails();   // hexspark-r65: dead sparks' tails fade out over a few frames instead of popping
      if (still && still.shot) {   // the killing projectile, re-drawn frozen at its impact instant (it was spliced on death)
        const sh = still.shot;      // seen flights carry real vx/vy/len; the never-drawn fallback is a kind:'shot' disc — no guessed flight state needed
        drawShot(ctx, sh, sh.x, sh.y);
      }
      for (const slot of [0, 1]) {   // catch ghosts (catchghost-r58): the caught arc rides home into the grip — no pop at the touch point
        const fx = catchFx[slot];
        if (!fx) continue;
        const age = G.t - fx.t + viewA;
        if (age > CGHOST_T || !fx.st) { catchFx[slot] = null; continue; }
        const v = view[slot], p = age / CGHOST_T, e = p * p;   // ease-in: leaves the catch point, accelerates into the hand
        drawShot(ctx, fx.st, fx.x0 + (v.x - fx.x0) * e, fx.y0 + (v.y - fx.y0) * e);
      }
      // the K.O. card's type was removed at owner word 2026-10-21 ("i dont
      // want it to be announced"): the round's end reads as the kill-still
      // freeze + the faded disc + the scorebug tick, then the next reveal.
      // The ko-phase beat (koTicks) itself stays — it is pacing, not announcement.
    }
    if (G.phase !== 'reveal') drawParryFx(ctx, dtFrames);   // parryfx-r1: on top of weapons, under the debug overlay
    else parryFx.length = 0;
    if (showHitbox && G.phase !== 'reveal') drawHitboxes(ctx, view);
    drawBanner(dtFrames);
    if (UNBAKED.length) {   // art-preview watermark: raw deliveries boot as ghosts
      ctx.font = '700 22px system-ui';
      ctx.fillStyle = TH.botInk;
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('ART PREVIEW — HITBOXES UNBAKED: ' + UNBAKED.join(', '), -OV_MARGIN + 8, -OV_MARGIN + 8);
    }

    // flash decay (renderer-side timing)
    for (let i = 0; i < 2; i++) { flashV[i] *= Math.pow(0.88, dtFrames); poisonPulse[i] *= Math.pow(0.82, dtFrames); }   // affinity-r66: the bite flash decays on the same wall-time clock (fxRate'd dtFrames — it throbs in slow-mo, freezes at the KO)   // the flip transition's clock lives in the view build (same frozen dtFrames)
  }

  /* ---- main loop ---- */
  let lastNow = performance.now();
  let tickAcc = 0;
  let stopTicks = 0;             // KO hard-freeze remaining, in SIM ticks (frame-loop layer only — the sim never reads it; since slowmo-r63 the kill beat is its only user)
  let slowTicks = 0;             // slowmo-r63: the hit-slow window remaining, in wall-clock SIM ticks — while > 0 the accumulator runs at CFG.hitSlowRate (frame-loop layer only — the sim never reads it)
  let fxRate = 1;                // slowmo-r63: this frame's effective world rate for the WALL-TIME FX (flash decay, banner) — 0 in the KO freeze (the impact frame holds, pause-r20), the window blend inside a hit-slow, else 1
  let viewA = 1;                   // render-interpolation alpha: leftover fraction toward the next tick (sumo_war pattern)
  /* shortest-arc angle lerp — wAngle accumulates unwrapped, so the seam is
   * taken mod 2π: the blend always rotates the short way round. */
  function lerpAng(a, b, t) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    else if (d < -Math.PI) d += TAU;
    return a + d * t;
  }
  /* v0.8-step1b: real-time catch-up loop. The old fixed 2-ticks-per-frame
   * design fell into slow-motion whenever a frame overran its budget (GC
   * pause, clash cost): sim time drifted behind wall time and the fight
   * looked laggy (owner report). Now ticks are owed to the wall clock and
   * caught up, capped so a stall cannot spiral. Fast-forward stays 4x.
   * v0.8.2: when the cap does engage, the leftover debt is shed instead of
   * burst-ticked later (sumo_war pattern), and viewA is computed for the
   * renderer's interpolation between the last two tick poses. */
  function frame(now) {
    requestAnimationFrame(frame);
    const dtms = Math.max(0, Math.min(50, now - lastNow)); lastNow = now;   // clamp both ways: a non-monotonic clock (harness stubs rewinding) must never feed a negative dt into the accumulator or the hitstop counter
    const dtFrames = dtms / (1000 / 60);
    fxRate = stopTicks > 0 ? 0 : 1;   // flagfix-r64: PER-FRAME init — the r63 original only assigned fxRate inside the advance block, so once G.over skipped the block the variable kept the KO freeze's 0 forever and the winner overlay's wall-time FX (flash decay, banner) froze with it; the branches below overwrite this each fighting frame
    if (!paused && !G.over) {
      /* catch-up rates, off CFG.tickHz (single source): 1× real time ·
       * fast = 4× · slow = ¼× (owner request 2026-10-19 — the opposite of
       * fast forward; the v0.8.2 render interpolation keeps sub-tick
       * playback smooth). Slow and fast are mutually exclusive — engaging
       * one releases the other. */
      const adv = dtms * CFG.tickHz * (fast ? 4 : slow ? 0.25 : 1) / 1000;
      /* KO-freeze gate (owner decision 2026-10-19, trigger policy 1; the kill
       * beat KEPT its hard freeze at slowmo-r63 — "keep ko hard freeze"):
       * while stopTicks > 0 the accumulator is gated — sim time freezes while
       * rendering continues (wall-clock FX freeze with it, see the draw call
       * below). The freeze counts down on the SAME clock as tickAcc, so it is
       * a fixed number of SIM ticks: 4× fast-forward passes it in ¼ the wall
       * time, ¼× slow stretches it in wall time. Overflow when the freeze
       * expires carries into tickAcc — no wall time is ever lost. */
      if (stopTicks > 0) {
        stopTicks -= adv;
        if (stopTicks < 0) { tickAcc += -stopTicks; stopTicks = 0; }
        fxRate = 0;   // the impact frame holds (pause-r20)
      } else {
        /* Hit-slow window (slowmo-r63): while slowTicks > 0 the accumulator
         * runs at CFG.hitSlowRate instead of gating to zero — the sim keeps
         * LIVING in slow motion, so queued contacts resolve inside the beat
         * (the freeze's slideshow class is structurally gone). The window
         * counts down on the SAME wall clock the freeze used (FF shortens it,
         * the 's' mode stretches it). Smoothness laws ("make the slow mo nice
         * and smooth" — owner): (1) the EXPIRY frame BLENDS — the fraction of
         * adv still inside the window runs slow, the remainder full-rate, so
         * there is no seam at the transition; (2) ¼× is the 's'-mode rate
         * v0.8.2's interpolation was built for — fractional tickAcc keeps the
         * sub-tick pose blend alive, slow motion reads steppy-free; (3) the
         * tick loop does NOT break on a fresh window — the frame finishes its
         * ≤2 integer ticks (sub-frame at 1×) and the slow begins on the next
         * frame's blend, so NO queued tick is ever dropped (the freeze-era
         * break shed up to n−i ticks; only the KO freeze still breaks, its
         * latch semantics want the instant gate). */
        if (slowTicks > 0) {
          const inWin = adv > 0 ? Math.min(1, slowTicks / adv) : 1;   // fraction of this frame's wall time inside the window
          fxRate = inWin * CFG.hitSlowRate + (1 - inWin);
          slowTicks = Math.max(0, slowTicks - adv);
        } else fxRate = 1;
        tickAcc += adv * fxRate;
        let n = Math.floor(tickAcc);
        if (n > 10) { n = 10; tickAcc %= 1; }   // long stall: cap the catch-up AND shed the debt — no fast-forward burst afterwards
        else tickAcc -= n;
        for (let i = 0; i < n; i++) {
          tick(G);
          consumeEvents(G);
          if (G.over || stopTicks > 0) break;   // a KILL this frame: freeze NOW (koStill latches off the events; the unspent accumulator rides through the gate) — a non-kill only arms slowTicks, which the NEXT frame blends into
        }
      }
    }
    if (G.over) { stopTicks = 0; slowTicks = 0; }   // never strand a leftover freeze or slow window on the winner overlay — the flash must decay and the card read
    /* Interpolation alpha only while the fight sim actually steps. In every
     * other phase (paused, reveal, K.O. card, over) poses are frozen while
     * tickAcc keeps churning phase timers — blending against a moving alpha
     * would visibly oscillate the actors, so those frames render the exact
     * latest tick pose (viewA = 1) and stand still. During the KO freeze in
     * the fight phase tickAcc itself is gated, so the alpha holds its leftover
     * fraction and the pose stands still the same way — no snap. Inside a
     * hit-slow window (slowmo-r63) the alpha KEEPS MOVING — fractional
     * tickAcc at ¼× is exactly the 's'-mode case the interpolation was built
     * for, so the slow motion renders as a blend, never as a stutter. */
    viewA = (!paused && !G.over && G.phase === 'fight') ? clamp01(tickAcc) : 1;
    draw(dtFrames * fxRate);   // wall-time FX (flash decay, banner): held in the KO freeze (fxRate 0 — the impact frame holds, pause-r20), SLOWED with the world inside a hit-slow window (the flash lives in the same slow motion — no frozen-frame read), full-rate otherwise
  }
  requestAnimationFrame(frame);

  /* ---- input ---- */
  // ONE implementation of each toggle: the keyboard and window.APP (hence the chrome chips) both call these.
  const actions = {
    togglePause() { paused = !paused; },
    toggleSlow() { slow = !slow; if (slow) fast = false; },    // slow and fast are mutually exclusive
    toggleFF() { fast = !fast; if (fast) slow = false; },
    toggleHitbox() { showHitbox = !showHitbox; },
    nextSeed() { restart(seed + 1); },
  };
  const KEY_ACTION = { p: 'togglePause', ' ': 'togglePause', s: 'toggleSlow', f: 'toggleFF', h: 'toggleHitbox', n: 'nextSeed' };
  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;   // Ctrl/Cmd+F, +S, +R … belong to the browser; a held key must not machine-gun a toggle
    const k = e.key.toLowerCase();
    if (k === 'r') restart();
    else if (KEY_ACTION[k]) { actions[KEY_ACTION[k]](); if (k === ' ') e.preventDefault(); }   // Space would also scroll the page
  });

  window.APP = {
    restart: restart,
    setSeed: function (v) { restart(v | 0); },
    nextSeed: actions.nextSeed, togglePause: actions.togglePause, toggleSlow: actions.toggleSlow, toggleFF: actions.toggleFF, toggleHitbox: actions.toggleHitbox,
    setShotArt: function (kind, polys) { if (polys) SHOTS_ART[kind] = { polys: polys }; else delete SHOTS_ART[kind]; },   // arena review feeds the ship draw path
    setAccent: function (v) { ACC_OVERRIDE = v || null; },
    setCast: function (c) { CAST_OVERRIDE = c ? checkCast(c.slice()) : null; restart(); },   // pairing: pick 2 of the cast for the next battle; null restores the shipped default. Console lever for the owner's own eyes — no UI chip yet (the cast is still two)
    shotArtOf: function (k) { return SHOTS_ART[k] ? SHOTS_ART[k].polys : null; },   // read-back for the kitload smoke
    info: function () { return { seed: seed, paused: paused, slow: slow, fast: fast, showHitbox: showHitbox, stopMs: Math.max(0, stopTicks * 1000 / CFG.tickHz), koStill: koStill, flip: [flipAnim[0].cur, flipAnim[1].cur], flipT: [flipAnim[0].t, flipAnim[1].t] }; },   // flip = the swept value flipproof reads; flipT = its raw transition parameter, a debug read-back with no consumer today
    state: function () { return G; },
    meta: {
      fighters: FIGHTERS.map((f, i) => ({ name: f.name, col: COLS[i], tint: TINTS[i], skill: SKILL_SHORT[i] })),
      weapons: Object.fromEntries(WEAPON_IDS.map(id => {
        const W = WEAPONS[id];
        const brief = W.brief || (W.shot ? '+SPD / Hit · ' + (W.shot.what || 'arrow') + ' / rev' : (W.trait.spin ? '+SPD / Hit' : '+DMG / Hit'));   // an authored `brief` wins; the derivation is a fallback for plain spin/dmg rows only (a boot guard requires one for any other trait axis)
        return [id, { name: W.name, brief: brief, line: W.line }];
      })),
      hz: CFG.tickHz,
    },
  };
})();
</script>

<script>
  // Chrome — sumo-war style. Additive only; drives the app through window.APP.
  (function () {
    const api = window.APP;
    const el = Object.fromEntries(['pz', 'sl', 'ff', 'rs', 'ns', 'hb', 'sd', 'ld', 'pa', 'wn', 'wsc', 'win', 'bug', 'lg', 'st']
      .map(id => [id, document.getElementById(id)]));
    let lgHtml = '', bugHtml = '', stText = '';

    // chips run their API call, then drop focus so the keyboard shortcuts keep working
    const onClick = (id, fn) => { el[id].onclick = (e) => { fn(); e.currentTarget.blur(); }; };
    onClick('pz', () => api.togglePause());
    onClick('sl', () => api.toggleSlow());
    onClick('ff', () => api.toggleFF());
    onClick('rs', () => api.restart());
    onClick('ns', () => api.nextSeed());
    onClick('pa', () => api.nextSeed());
    onClick('hb', () => api.toggleHitbox());
    const loadSeed = () => { const v = parseInt(el.sd.value, 10); if (v >= 1) api.setSeed(v); };
    onClick('ld', loadSeed);
    el.sd.onkeydown = (e) => { if (e.key === 'Enter') { loadSeed(); el.sd.blur(); } };

    function scorebugHtml(G, meta) {
      const a = meta.fighters[G.cast[0]], b = meta.fighters[G.cast[1]];   // scorebug is SLOT-ordered: each name sits over its own side's wins, whatever cast fills it
      return `<span class="side"><i style="background:${a.col}"></i><b style="color:${a.tint}">${a.name}</b></span>` +
        `<span class="mid">${G.wins[0]} – ${G.wins[1]}</span>` +
        `<span class="side"><b style="color:${b.tint}">${b.name}</b><i style="background:${b.col}"></i></span>`;
    }
    function rowHtml(f, meta) {
      const m = meta.fighters[f.idx];   // meta.fighters is the ROSTER (idx-keyed), so the legend row reads its actor's own name/colour/skill on either side
      const w = f.weapon ? meta.weapons[f.weapon] : null;
      const spin = f.weapon ? Math.abs(f.spin) : 0;
      const spd = f.weapon ? (spin < 10 ? spin.toFixed(1) : String(Math.round(spin))) : '—';
      const dmg = f.weapon ? String(Math.round(f.dmg)) : '—';
      return `<tr${f.alive ? '' : ' class="out"'}>` +
        `<td><span class="who"><i class="sw" style="background:${m.col}"></i><span class="qn" style="color:${m.tint}">${m.name}</span></span></td>` +
        `<td class="ex">${m.skill}</td>` +
        '<td class="air"></td>' +
        `<td>${w ? `<span class="wp">${w.name}</span>` : '<span class="wp idle">rolling…</span>'}</td>` +
        `<td class="ex">${w ? w.brief : ''}</td>` +
        '<td class="air"></td>' +
        `<td class="st"><span class="nums"><span>SPD <b>${spd}</b></span><span>DMG <b>${dmg}</b></span></span></td></tr>`;
    }
    const legendHtml = (G, meta) => `<div class="ccard"><table class="lg">${G.fighters.map(f => rowHtml(f, meta)).join('')}</table></div>`;

    // innerHTML/textContent are written only when the string actually changed
    function poll() {
      const G = api.state(), info = api.info(), meta = api.meta;

      // chip states
      el.pz.textContent = info.paused ? 'Resume' : 'Pause';
      el.pz.classList.toggle('on', info.paused);
      el.sl.classList.toggle('on', info.slow);
      el.ff.classList.toggle('on', info.fast);
      el.hb.classList.toggle('on', info.showHitbox);
      if (document.activeElement !== el.sd) el.sd.value = String(info.seed);

      // winner overlay + battle stats line
      if (G.over) {
        el.wn.textContent = meta.fighters[G.cast[G.winner]].name;   // G.winner is a SLOT (it is read off the slot-keyed wins); meta.fighters is the cast roster
        el.wsc.textContent = G.wins[0] + '–' + G.wins[1];
        el.win.hidden = false;
        const line = (G.t / meta.hz).toFixed(1) + 's · ' + G.stats.hits + ' hits · ' + G.stats.parries +
          ' parries · max spin ' + G.maxSpin.toFixed(1) + ' · max dmg ' + Math.round(G.maxDmg) +
          (G.stats.thrown ? ' · shots ' + G.stats.thrown + ' thrown / ' + G.stats.landed + ' landed / ' + G.stats.swatted + ' swatted' : '');
        if (line !== stText) el.st.textContent = stText = line;
      } else {
        el.win.hidden = true;
        if (stText) { el.st.textContent = ''; stText = ''; }
      }

      const bug = scorebugHtml(G, meta);
      if (bug !== bugHtml) el.bug.innerHTML = bugHtml = bug;
      const html = legendHtml(G, meta);
      if (html !== lgHtml) el.lg.innerHTML = lgHtml = html;
    }
    setInterval(poll, 100);
    poll();
  })();
</script>
</body>
</html>
